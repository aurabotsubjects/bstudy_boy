<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boy: Tales of Childhood — Book Study</title>
<link id="app-favicon" rel="icon" type="image/png" href="">
<script src="images.js"></script>
<script>
  document.getElementById('app-favicon').href = IMG_FAVICON;
  document.documentElement.style.setProperty('--hero-img', 'url("' + IMG_HERO + '")');
  document.documentElement.style.setProperty('--bg-pattern', 'url("' + IMG_BG_PATTERN + '")');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2E7D0; --paper:#FBF4E3; --ink:#2B2117; --ink-soft:#5B4E3D;
    --navy:#1C2B3A; --navy-2:#26384B; --brass:#A97B24; --brass-ink:#7A5A19;
    --oxblood:#8A3030; --fjord:#2F6459; --line:#D9C79E;
    --radius:10px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#17212B; --paper:#1E2A37; --ink:#EEE3C8; --ink-soft:#C4B79A;
      --navy:#0E161F; --navy-2:#16222E; --brass:#D8A94B; --brass-ink:#EFCB80;
      --oxblood:#D08080; --fjord:#7FC2B4; --line:#3A4A5A;
    }
  }
  :root[data-theme="dark"]{
    --cream:#17212B; --paper:#1E2A37; --ink:#EEE3C8; --ink-soft:#C4B79A;
    --navy:#0E161F; --navy-2:#16222E; --brass:#D8A94B; --brass-ink:#EFCB80;
    --oxblood:#D08080; --fjord:#7FC2B4; --line:#3A4A5A;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Karla',ui-sans-serif,system-ui,sans-serif;
    line-height:1.55; min-height:100%;
    position:relative;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background-image:var(--bg-pattern); background-repeat:repeat; background-size:280px;
    opacity:.16; pointer-events:none;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body::before{opacity:.07; filter:invert(1) hue-rotate(180deg);} }
  :root[data-theme="dark"] body::before{opacity:.07; filter:invert(1) hue-rotate(180deg);}
  .brand-mark img{display:block; height:26px; width:26px; object-fit:contain; border-radius:5px;}
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,'Times New Roman',serif; font-weight:600; color:var(--ink); margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  .wrap{max-width:880px; margin:0 auto; padding:0 20px;}
  .narrow{max-width:640px;}

  /* ---- Top nav ---- */
  .topnav{
    position:sticky; top:0; z-index:20; background:var(--navy); color:var(--cream);
    padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer; background:none; border:none; color:inherit; padding:0;}
  .brand-mark{font-size:1.3rem;}
  .brand-text{font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem; letter-spacing:.01em;}
  .crumbs{font-size:.85rem; color:#D9C79E; opacity:.9;}
  .crumbs button{background:none;border:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0;}

  /* ---- Hero ---- */
  .hero{position:relative; overflow:hidden; border-bottom:1px solid var(--line);}
  .hero-art{
    width:100%; aspect-ratio:16/7; min-height:220px;
    background-image:var(--hero-img); background-size:cover; background-position:center 60%;
    display:flex; align-items:center; justify-content:center; text-align:center;
    border-bottom:3px solid var(--brass);
  }
  .hero-copy{padding:34px 20px 30px; text-align:center;}
  .hero-copy h1{font-size:clamp(1.7rem,4.5vw,2.5rem); line-height:1.15;}
  .hero-copy .sub{font-family:'Fraunces',serif; font-style:italic; color:var(--brass-ink); font-size:1.05rem; margin-top:6px;}
  .hero-copy p{max-width:560px; margin:14px auto 0; color:var(--ink-soft);}

  .btn{
    display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer;
    background:var(--oxblood); color:#FBF4E3; font-weight:700; font-size:.95rem;
    padding:11px 20px; border-radius:6px; transition:transform .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:focus-visible, a:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--brass); outline-offset:2px;}
  .btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
  .btn.small{padding:7px 14px; font-size:.85rem;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ---- Section shell ---- */
  .section{padding:34px 0;}
  .section-head{margin-bottom:18px;}
  .section-head h2{font-size:1.4rem;}
  .section-head .kicker{color:var(--brass-ink); font-weight:700; font-size:.8rem; letter-spacing:.02em;}

  /* ---- Term shelf ---- */
  .shelf{display:flex; gap:12px; overflow-x:auto; padding:6px 2px 14px; -webkit-overflow-scrolling:touch;}
  .tag-card{
    flex:0 0 148px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 12px; position:relative;
  }
  .tag-card::before{
    content:""; position:absolute; top:8px; left:8px; width:6px; height:6px; border-radius:50%;
    background:var(--brass); box-shadow:calc(100% - 20px) 0 0 var(--brass);
  }
  .tag-card .wk{font-family:'Fraunces',serif; font-weight:700; color:var(--oxblood); font-size:.95rem;}
  .tag-card p{font-size:.78rem; color:var(--ink-soft); margin:6px 0 10px; min-height:44px;}
  .tag-card.active{border-color:var(--brass); box-shadow:0 2px 0 var(--brass);}
  .tag-card.locked{opacity:.55;}
  .tag-card button{width:100%;}

  /* ---- Day cards ---- */
  .li-box{background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--fjord); border-radius:var(--radius); padding:16px 18px; margin-bottom:22px;}
  .li-box p{margin:6px 0 0; color:var(--ink-soft); font-size:.92rem;}
  .li-box .lbl{font-size:.75rem; font-weight:700; letter-spacing:.02em; color:var(--fjord);}

  .daygrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px;}
  .daycard{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 16px; text-align:left; cursor:pointer; position:relative; overflow:hidden;
  }
  .daycard::after{content:""; position:absolute; left:0; right:0; top:0; height:4px; background:var(--brass);}
  .daycard.quiz::after{background:var(--oxblood);}
  .daycard .icon{font-size:1.6rem;}
  .daycard .day{font-family:'Fraunces',serif; font-weight:700; font-size:1.05rem; margin-top:8px;}
  .daycard .mode{font-size:.72rem; color:var(--brass-ink); font-weight:700; margin:2px 0 8px;}
  .daycard .chap{font-size:.85rem; color:var(--ink-soft);}

  .projects{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:14px;}
  .project{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .project .icon{font-size:1.3rem;}
  .project h3{font-size:.95rem; margin:6px 0 4px;}
  .project p{font-size:.82rem; color:var(--ink-soft); margin:0;}

  /* ---- Slideshow (teacher mode) ---- */
  .stage{background:var(--navy); color:var(--cream); border-radius:14px; padding:8px; margin-top:10px;}
  .slide{min-height:min(60vh,440px); display:flex; flex-direction:column; justify-content:center; padding:38px 30px; text-align:center;}
  .slide .kicker{color:var(--brass); font-weight:700; letter-spacing:.03em; font-size:.8rem; margin-bottom:10px;}
  .slide h2{font-family:'Fraunces',serif; font-size:clamp(1.3rem,3.6vw,1.9rem); color:var(--cream); max-width:620px; margin:0 auto;}
  .slide p, .slide li{font-size:1.05rem; color:#E7DCC0; max-width:600px; margin:12px auto 0;}
  .slide ul{list-style:none; padding:0; text-align:left; display:inline-block;}
  .slide ul li{margin:10px 0; padding-left:26px; position:relative;}
  .slide ul li::before{content:"—"; position:absolute; left:0; color:var(--brass);}
  .slide .range{display:inline-block; margin-top:16px; border:1px solid var(--brass); color:var(--brass); border-radius:20px; padding:6px 16px; font-size:.85rem;}
  .stage-bar{display:flex; align-items:center; justify-content:space-between; padding:12px 16px 4px; color:#C9BC9A; font-size:.82rem;}
  .stage-nav{display:flex; gap:10px; padding:0 16px 14px;}
  .stage-nav button{flex:1; background:var(--navy-2); color:var(--cream); border:1px solid #3A4A5A; padding:10px; border-radius:8px; cursor:pointer; font-weight:700;}
  .stage-nav button:disabled{opacity:.35; cursor:not-allowed;}
  .dots{display:flex; gap:6px;}
  .dots span{width:7px; height:7px; border-radius:50%; background:#465A6D;}
  .dots span.on{background:var(--brass);}

  /* ---- Worksheet (group mode) ---- */
  .toggle{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:10px 0 20px;}
  .toggle button{background:var(--paper); color:var(--ink-soft); border:none; padding:9px 16px; cursor:pointer; font-weight:700; font-size:.85rem;}
  .toggle button.on{background:var(--navy); color:var(--cream);}
  .worksheet{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px;}
  .worksheet h3{font-size:1rem; color:var(--oxblood);}
  .worksheet .q{margin:18px 0;}
  .worksheet .pq{margin:16px 0;}
  .worksheet .print-opt{margin:2px 0 2px 18px; font-size:.9rem;}
  .worksheet label{display:block; font-size:.92rem; margin-bottom:6px; color:var(--ink);}
  .worksheet textarea{
    width:100%; border:1px solid var(--line); border-radius:6px; background:var(--cream);
    color:var(--ink); font-family:inherit; font-size:.92rem; padding:10px; resize:vertical;
  }
  .save-note{font-size:.78rem; color:var(--ink-soft); margin-top:8px;}
  .print-lines{border-bottom:1px solid var(--ink-soft); height:34px; margin-top:6px;}
  .print-only-btn{margin-bottom:14px;}
  @media print{
    .topnav,.hero,.section-head,.toggle,.print-only-btn,.progress{display:none !important;}
    body{background:#fff; color:#000;}
    .worksheet{border:none; padding:0;}
  }

  /* ---- Quiz ---- */
  .quiz-q{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;}
  .quiz-q .num{font-size:.75rem; color:var(--brass-ink); font-weight:700;}
  .quiz-q p.qtext{margin:4px 0 10px; font-weight:500;}
  .opt{display:flex; align-items:flex-start; gap:8px; padding:7px 0; font-size:.92rem; cursor:pointer;}
  .opt input{margin-top:4px;}
  .quiz-q.correct{border-color:var(--fjord); box-shadow:inset 3px 0 0 var(--fjord);}
  .quiz-q.incorrect{border-color:var(--oxblood); box-shadow:inset 3px 0 0 var(--oxblood);}
  .reveal-btn{background:none; border:1px dashed var(--line); color:var(--ink-soft); border-radius:6px; padding:6px 12px; font-size:.8rem; cursor:pointer;}
  .model{display:none; margin-top:10px; font-size:.88rem; color:var(--fjord); font-style:italic;}
  .model.show{display:block;}
  .score-banner{background:var(--navy); color:var(--cream); border-radius:var(--radius); padding:16px 20px; margin-bottom:16px; font-family:'Fraunces',serif; font-size:1.15rem;}

  .back-row{margin-top:26px;}
  footer{padding:30px 20px 50px; text-align:center; font-size:.8rem; color:var(--ink-soft);}

  /* ---- Lesson plan (printable) ---- */
  .lp{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px 22px; margin:14px 0 22px;}
  .lp-head h3{font-size:1.05rem;}
  .lp-meta{font-size:.8rem; color:var(--ink-soft); margin:2px 0 12px;}
  .lp-row{margin:12px 0; font-size:.92rem;}
  .lp-row > strong{color:var(--oxblood);}
  .lp-row ul{margin:6px 0 0 18px; padding:0;}
  .lp-timing{border-collapse:collapse; margin-top:6px;}
  .lp-timing td{border:1px solid var(--line); padding:4px 12px; font-size:.85rem;}
  .lp-rubric-note{background:var(--cream); border-left:3px solid var(--fjord); padding:10px 14px; border-radius:6px;}
  .rtag{display:inline-block; background:var(--fjord); color:#fff; font-size:.7rem; padding:2px 9px; border-radius:10px; margin:8px 6px 0 0;}
  .lp-actions{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 16px;}

  /* ---- Week pack ---- */
  .wp-cover{text-align:center; padding:18px 0 22px; border-bottom:2px solid var(--brass); margin-bottom:14px;}
  .wp-day-title{font-family:'Fraunces',serif; font-weight:700; font-size:1.15rem; color:var(--oxblood); margin:22px 0 4px; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .wp-opts{display:flex; flex-wrap:wrap; gap:14px 20px; align-items:center; margin:14px 0 22px; font-size:.9rem;}
  .wp-opts label{display:flex; align-items:center; gap:6px; cursor:pointer;}
  @media print{ .wp-section{break-after:page;} .wp-section:last-of-type{break-after:auto;} }

  /* ---- Rubric ---- */
  .rubric-scroll{overflow-x:auto; margin-top:10px;}
  .rubric-table{border-collapse:collapse; width:100%; min-width:640px;}
  .rubric-table th,.rubric-table td{border:1px solid var(--line); padding:9px 12px; font-size:.85rem; vertical-align:top; text-align:left;}
  .rubric-table thead th{background:var(--navy); color:var(--cream);}
  .rubric-crit{min-width:230px;}
  .rcode{display:block; font-weight:700; color:var(--oxblood); font-size:.85rem;}
  .rdesc{display:block; color:var(--ink-soft); font-size:.8rem; margin-top:3px;}
  .rweeks{display:block; font-size:.72rem; color:var(--brass-ink); margin-top:5px; font-weight:700;}
  .rubric-cell{cursor:pointer; text-align:center; min-width:90px; font-size:1rem;}
  .rubric-cell.on{background:var(--fjord); color:#fff; font-weight:700;}
  .rubric-add{display:flex; gap:8px; align-items:center; margin:14px 0 4px; flex-wrap:wrap;}
  .rubric-add input{padding:9px 11px; border:1px solid var(--line); border-radius:6px; font-family:inherit; background:var(--cream); color:var(--ink);}
  .rm-btn{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:.75rem; margin-left:6px;}
  .nav-actions{display:flex; align-items:center; gap:10px;}
  .nav-actions button{background:none; border:1px solid rgba(242,231,208,.4); color:inherit; font:inherit; font-size:.78rem; border-radius:20px; padding:5px 12px; cursor:pointer;}

  @media print{
    .topnav,.hero,.section-head,.toggle,.print-only-btn,.progress,.no-print,.back-row{display:none !important;}
    body{background:#fff; color:#000;}
    body::before{display:none !important;}
    .worksheet{border:none; padding:0;}
    .lp,.wp-cover{border:none; padding:0;}
  }

  /* ---- Student workbook (booklet) ---- */
  .wb-doc{max-width:794px; margin:0 auto 40px; padding:0 12px;}
  .wb-sec{background:#fff; color:#1b1b1b; border:1px solid var(--line); box-shadow:0 2px 10px rgba(0,0,0,.12); padding:28px 32px; margin:0 0 22px; border-radius:4px; font-size:.95rem;}
  .wb-sec h2{color:#1b1b1b; font-size:1.35rem; margin:2px 0 6px;}
  .wb-sec h3{color:#8A3030; font-size:1rem; margin:16px 0 4px;}
  .wb-sec p{margin:6px 0;}
  .wb-kick{color:#7A5A19; font-weight:700; font-size:.75rem; letter-spacing:.06em;}
  .wb-ln{border-bottom:1px solid #8a7d68; height:9mm;}
  .wb-box{border:1px solid #cdbf9c; border-left:4px solid #2F6459; background:#fbf7ea; padding:10px 14px; margin:10px 0; border-radius:4px;}
  .wb-box b{color:#2F6459; font-size:.75rem; letter-spacing:.04em;}
  .wb-check{display:flex; gap:14px; flex-wrap:wrap; font-size:.85rem; margin:4px 0 8px;}
  .wb-proj{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0;}
  .wb-proj div{border:1px solid #cdbf9c; border-radius:6px; padding:8px 12px; font-size:.85rem; break-inside:avoid;}
  .wb-proj b{display:block; color:#8A3030;}
  .wb-q{break-inside:avoid; margin:12px 0;}
  .wb-opt{margin:2px 0 2px 18px; font-size:.9rem;}
  .wb-cover{container-type:inline-size; position:relative; padding:0; overflow:hidden; border-radius:4px;}
  .wb-cover img{display:block; width:100%; height:auto;}
  .wb-title{position:absolute; left:19%; width:62%; top:13.6%; height:16.5%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#3b2612; line-height:1; font-family:'Fraunces',Georgia,serif;}
  .wb-title b{font-size:12cqw; font-weight:700; letter-spacing:.04em;}
  .wb-title i{font-size:5cqw; font-weight:600; margin-top:.4cqw;}
  .wb-title span{font-family:'Karla',sans-serif; font-size:2cqw; letter-spacing:.22em; text-transform:uppercase; font-weight:700; color:#7A5A19; margin-top:1.6cqw;}
  .wb-name{position:absolute; left:23.5%; top:84.4%; font-family:'Karla',sans-serif; font-size:2.3cqw; letter-spacing:.2em; text-transform:uppercase; font-weight:700; color:#7A5A19;}
  /* ---- Reading schedule table ---- */
  .rs{border-collapse:collapse; width:100%; font-size:.8rem; margin-top:6px;}
  .rs th,.rs td{border:1px solid #cdbf9c; padding:2.5px 8px; text-align:left; vertical-align:middle;}
  .rs thead th{background:#f3ead2; color:#7A5A19; font-size:.72rem; letter-spacing:.04em;}
  .rs tr.wk td{background:#1C2B3A; color:#F2E7D0; font-family:'Fraunces',Georgia,serif; font-weight:600; padding:3px 8px; border-color:#1C2B3A;}
  .rs tr.wk td span{float:right; font-family:'Karla',sans-serif; font-size:.72rem; font-weight:700; color:#D9C79E;}
  .rs tr{break-inside:avoid;}
  .rs .d{width:17mm; font-weight:700;}
  .rs .by{width:24mm; font-size:.75rem;}
  .rs .pp{width:28mm; color:#8a7d68; font-size:.75rem;}
  .rs .ok{width:10mm; text-align:center;}
  .rs small{display:block; color:#5b4e3d; font-size:.72rem; line-height:1.25;}
  @media print{
    .wb-doc{max-width:none; margin:0; padding:0;}
    .wb-sec{border:none; box-shadow:none; padding:0; margin:0; border-radius:0; break-before:page; font-size:11pt;}
    .wb-cover{width:210mm; height:297mm; break-before:auto; break-after:page;}
    .wb-cover img{height:100%; object-fit:cover;}
  }

  /* ---- Completion certificate ---- */
  .certificate{border:6px double var(--brass); border-radius:10px; padding:56px 40px; text-align:center; background:var(--paper); max-width:680px; margin:26px auto;}
  .cert-kicker{letter-spacing:.1em; text-transform:uppercase; font-size:.72rem; color:var(--brass-ink); font-weight:700;}
  .cert-title{font-family:'Fraunces',serif; font-size:1.9rem; color:var(--oxblood); margin:12px 0 22px;}
  .cert-line{color:var(--ink-soft); max-width:520px; margin:10px auto;}
  .cert-name{font-family:'Fraunces',serif; font-style:italic; font-size:1.3rem; margin:24px auto; border-bottom:1px solid var(--line); padding-bottom:10px; max-width:440px; min-height:1.6em;}
  .cert-row{display:flex; justify-content:center; gap:34px; flex-wrap:wrap; margin-top:30px; font-size:.85rem; color:var(--ink-soft);}
  .wb-cert .certificate{background:#fff; margin:0; max-width:none;}
  @media print{ .certificate{border-color:#A97B24;} }
</style>
<style id="pageRules"></style>
</head>

<div id="app"></div>

<script>
/* ============ CONTENT DATA (from Boy_Book_Study_Unit_Plan.md, Week 1) ============ */
const NZC_LINES = [
  'Reading – Ideas: Show understanding of ideas within, across, and beyond texts.',
  'Reading – Structure & Language: Show understanding of how texts are shaped for different purposes and audiences.',
  'Reading – Processes & Strategies: Integrate sources of information, processes and strategies to identify, form and express ideas.',
  'Writing – Ideas: Select, form and communicate ideas on a range of topics.',
  'Writing – Structure & Language: Show understanding of language features, using them appropriately.',
  'Writing – Processes & Strategies: Select and use processes and strategies to communicate confidently.',
  'Key Competencies: Thinking, Managing Self, Relating to Others, Participating & Contributing.'
];

/* Whole-programme reading achievement rubric (NZC English, Level 3–4) */
const RUBRIC = [
  {id:'r1', code:'Reading — Ideas', text:'Explains ideas within, across and beyond the text (e.g. why Dahl chooses to remember certain moments).', weeks:'Checkpoints: Wk1 Mon/Wed · Wk2 Mon · Wk3 Mon/Tue · Wk9'},
  {id:'r2', code:'Reading — Structure & Language', text:'Identifies how the memoir is shaped for its purpose, incl. hyperbole and comic exaggeration.', weeks:'Checkpoints: Wk1 Thu · Wk2 Mon · Wk3 Wed · Wk6'},

const WEEK5 = {"li": "We can explore how people cope with difficult emotions, and evaluate the choices characters make in a text.", "sc": "I can explain the trick young Roald used to try to get sent home, and evaluate whether it was a wise choice; I can describe how travel in the 1920s differed from today.", "days": [{"key": "mon", "label": "Monday", "mode": "teacher", "icon": "📖", "chapter": "The Matron (Part 2)", "leadIn": ["What's the strangest or funniest rule you've heard about from a much older relative's schooldays?"], "comp": ["How does Roald cope with his first, most homesick night at St Peter's — what small routine does he create for himself?", "Why do you think Dahl includes such an odd and specific detail (facing the direction of home every night) in his memoir?"], "goAway": "Describe a small routine or object that has ever helped you feel less homesick, nervous, or alone.", "rubricIds": ["r3", "r4"], "rubricNote": "Tick off students who infer why Dahl includes the odd, specific detail of facing home every night (R3) — and who write a clear personal reflection about their own comforting routine (R4)."}, {"key": "tue", "label": "Tuesday", "mode": "group", "icon": "👥", "chapter": "Homesickness", "leadIn": ["Have you ever pretended to feel unwell to get out of something? Did it work — and how did you feel about it afterwards?"], "comp": ["What plan does Roald come up with to be sent home, and what earlier event gave him the idea?", "How does Dr Dunbar work out that Roald is faking, and what does he say the real problem is?"], "goAway": "Write about what you would say to a homesick friend instead of pretending to be ill, based on Dr Dunbar's advice to \"stick it out.\"", "rubricIds": ["r3", "r8"], "rubricNote": "During group discussion, tick off students who explain how Dr Dunbar worked out the trick and identifies the real problem (R3) — and who contribute constructively (R8)."}, {"key": "wed", "label": "Wednesday", "mode": "teacher", "icon": "📖", "chapter" /* Quiz data lists the correct MC option first; shuffle once (seeded, so screen, print copy and key always agree). */
function shuffleQuiz(qz,seed){
  let x=seed; const rnd=()=>{ x=(x*1664525+1013904223)%4294967296; return x/4294967296; };
  qz.forEach(q=>{ if(q.type!=='mc'||q.opts.length<3) return;
    const right=q.opts[q.a], o=q.opts.slice();
    for(let i=o.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; }
    q.opts=o; q.a=o.indexOf(right); });
}

/* ---- Friday quiz ---- */
function renderQuiz(day){
  const qs = CQ().map((q,i)=>{
    if(q.type==='mc'){
      const opts = q.opts.map((o,oi)=>`
        <label class="opt"><input type="radio" name="q${i}" value="${oi}" ${quizSubmitted?'disabled':''} ${quizSubmitted && window._quizPicks && window._quizPicks[i]===oi ? 'checked':''}>${o}</label>`).join('');
      return `<div class="quiz-q" id="qcard${i}"><div class="num">Question ${i+1}</div><p class="qtext">${q.q}</p>${opts}</div>`;
    }
    return `<div class="quiz-q" id="qcard${i}"><div class="num">Question ${i+1} · short answer</div><p class="qtext">${q.q}</p>
      <textarea rows="2" id="short${i}" ${quizSubmitted?'disabled':''}></textarea>

  }).join('');

    </div>
    ${scoreBanner}
    <div id="quizList">${qs}</div>
    ${quizSubmitted
      ? `<button class="btn ghost" onclick="quizSubmitted=false;render()">Try again</button>`
      : `<button class="btn" onclick="markQuiz()">Submit quiz</button>`}
    <div class="back-row"><button class="btn ghost" onclick="nav('weekhub')">← Back to Week ${curWeek}</button></div>
  </div>
  `;
}
function markQuiz(){
  let score = 0; window._quizPicks = {};
  CQ().forEach((q,i)=>{
    if(q.type!=='mc') return;
    const picked = document.querySelector(`input[name="q${i}"]:checked`);
    const val = picked ? parseInt(picked.value) : -1;
    window._quizPicks[i] = val;
    const card = document.getElementById('qcard'+i);
    if(val===q.a){ score++; card.classList.add('correct'); }
    else { card.classList.add('incorrect'); }
  });
  window._quizScore = score;
  quizSubmitted = true;
  render();
  window.scrollTo(0,0);
}

const READING_PLAN = [
 [['T','Starting-point → Papa and Mama'],['G','Kindergarten, 1922–3'],['T','The bicycle and the sweet-shop','Part 1: to the end of the backpedalling-bicycle memory'],['G','The bicycle and the sweet-shop','Part 2: Thwaites, the sweets, and Mrs Pratchett']],

 [['T','A visit to the doctor'],['G','First day'],['T','Writing home'],['G','The Matron','Part 1: introduction of the Matron → the sugar-on-the-corridor prank and its punishment']],

 [['T','Captain Hardcastle','Part 1: his introduction and appearance → the strict rules of Prep'],['T','Captain Hardcastle','Part 2: the rules of Prep in action, including the Braithwaite/wasp dialogue → the broken pen nib'],['G','Captain Hardcastle','Part 3: Roald whispers to Dobson → receiving the Stripe and the meeting with the Headmaster'],['G','Captain Hardcastle',"Part 4: the punishment → Highton's offer to write to his father"]],
 [['T','Little Ellis and the boil'],['G',"Goat's tobacco"],['T','Getting dressed for the big school'],['G','Boazers']],
 [['T','The Headmaster'],['G','Chocolates'],['T','Corkers'],['G','Fagging']],
 [['T','Games and photography'],['G','Goodbye school','Part 1: choosing a career instead of university → getting the job at Shell'],['T','Goodbye school','Part 2: leaving Repton on the motorbike → the Newfoundland expedition and Shell training'],['G','Goodbye school','Part 3: the posting to Egypt or East Africa → leaving for Africa']]
];

function readingRows(from,to){
  const DAYS=['Mon','Tue','Wed','Thu'];

  for(let i=from;i<to;i++){

    h+=`<tr class="wk"><td colspan="5">Week ${i+1} · ${WEEK_THEMES[i]}<span>Friday: quiz</span></td></tr>`;
    h+=READING_PLAN[i].map((r,di)=>`<tr><td class="d">${DAYS[di]}</td><td><b>${r[1]}</b>${r[2]?`<small>${r[2]}</small>`:''}</td><td class="by">${r[0]==='T'?'📖 Teacher':'👥 Group'}</td><td class="pp">pp. ____ – ____</td><td class="ok">☐</td></tr>`).join('');

  return h;
}

  else if(state.view==='quizprint') app.innerHTML = renderQuizPrintPage(false);
  else if(state.view==='quizprintkey') app.innerHTML = renderQuizPrintPage(true);
  else if(state.view==='workbook') app.innerHTML = renderWorkbook();
  else if(state.view==='readingplan') app.innerHTML = renderReadingPlan();
  else if(state.view==='certificate') app.innerHTML = renderCertificatePrint();
  /* A4 + full-bleed cover page only while the workbook is on screen, so other print jobs are unchanged */
  document.getElementById('pageRules').textContent = state.view==='workbook'
    ? '@page{size:A4;margin:14mm 14mm 16mm;@bottom-center{content:counter(page);font:9pt sans-serif;color:#777}} @page:first{margin:0;@bottom-center{content:none}}'
    : state.view==='readingplan' ? '@page{size:A4;margin:14mm 14mm 16mm}' : '';
}
render();

/* Keyboard nav for slideshow */
document.addEventListener('keydown', e=>{
  if(state.view!=='day' || curWeek===10) return;
  const day = CW().days.find(d=>d.key===state.day);
  if(!day || day.mode!=='teacher') return;
  const total = buildSlides(day).length;
  if(e.key==='ArrowRight'){ slideIdx=Math.min(total-1,slideIdx+1); render(); }
  if(e.key==='ArrowLeft'){ slideIdx=Math.max(0,slideIdx-1); render(); }
});
</script>
</body>
</html>
